name: Deploy Recall to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: recall-production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application tests
        run: node --test tests/deck-storage.test.js

      - name: Prepare production staging directory
        run: bash scripts/build-dist.sh

      - name: Verify production staging allowlist
        run: node --test tests/deployment-staging.test.js

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload website to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "no-cache"

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
