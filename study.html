<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Study flashcards with Recall." />
    <title>Study — Recall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="study.css" />
  </head>
  <body class="study-page">
    <header class="study-header">
      <a class="brand" href="index.html" aria-label="Recall home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>recall</span>
      </a>
      <a class="exit-link" href="index.html"><span aria-hidden="true">←</span> Back home</a>
    </header>
    <main class="study-main">
      <div class="deck-heading">
        <p class="eyebrow"><span></span><b id="deck-label"></b></p>
        <h1><span id="deck-title"></span> <em id="deck-title-accent"></em></h1>
        <p id="deck-description"></p>
        <button class="add-card-button" id="add-card-button" type="button">+ Add a card</button>
      </div>
      <section class="study-workspace" aria-label="Flashcard study session">
        <div class="session-progress" aria-live="polite">
          <span id="progress-text"></span>
          <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
          <span id="progress-percent"></span>
        </div>
        <article class="learning-card" id="learning-card">
          <div class="card-topline">
            <span class="deck-label"><span id="card-language"></span> · <span id="card-level"></span> · <span id="card-type"></span></span><span class="card-count" id="card-count"></span>
          </div>
          <div class="learning-card-content">
            <p class="prompt-label" id="card-prompt"></p>
            <h2 id="card-word" lang="ja"></h2>
            <p class="reading" id="card-reading" lang="ja"></p>
            <div class="learning-answer" id="learning-answer" aria-hidden="true">
              <span class="answer-rule"></span>
              <p class="meaning" id="card-meaning"></p>
              <p class="example"><span id="card-example" lang="ja"></span><br /><span id="card-translation"></span></p>
            </div>
          </div>
          <button class="study-reveal-button" id="study-reveal-button" type="button" aria-expanded="false">Reveal answer</button>
        </article>
        <div class="card-navigation" aria-label="Card navigation">
          <button class="nav-card-button" id="previous-card" type="button"><span aria-hidden="true">←</span> Previous</button>
          <p><kbd>Space</kbd> reveal <span>·</span> <kbd>←</kbd> <kbd>→</kbd> move</p>
          <button class="nav-card-button nav-card-next" id="next-card" type="button">Next <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </main>
    <dialog class="add-card-dialog" id="add-card-dialog" aria-labelledby="add-card-title">
      <form id="add-card-form">
        <div class="form-heading">
          <div>
            <p class="eyebrow"><span></span>Starter deck</p>
            <h2 id="add-card-title">Add a new card</h2>
          </div>
          <button class="dialog-close" id="close-add-card" type="button" aria-label="Close add card form">&times;</button>
        </div>
        <p class="form-intro">Complete every field. You can add up to 10 cards during this study session.</p>
        <div class="card-fields">
          <label>Word<input name="word" type="text" lang="ja" placeholder="食べる" required /></label>
          <label>Reading<input name="reading" type="text" lang="ja" placeholder="たべる"　required /></label>
          <label>Type<input name="type" type="text" placeholder="NOUN, VERB, etc." required /></label>
          <label>Meaning<input name="meaning" type="text"　 placeholder="To eat" required /></label>
          <label class="full-field">Example sentence<input name="example" type="text" lang="ja" placeholder="寿司を食べる。" required /></label>
          <label class="full-field">Example translation<input name="translation" type="text" placeholder="I eat breakfast" required /></label>
        </div>
        <p class="form-message" id="add-card-message" aria-live="polite"></p>
        <div class="form-actions">
          <span id="custom-card-count">0 of 10 custom cards added</span>
          <button class="save-card-button" type="submit">Add to deck</button>
        </div>
      </form>
    </dialog>
    <script src="study.js"></script>
  </body>
</html>
